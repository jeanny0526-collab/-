name: get stock price

on:
  schedule:
    # 台灣時間週一到週五 09:00~14:55，每 5 分鐘執行一次（已扣除 8 小時時差）
    - cron: "*/5 1-6 * * 1-5"
  # 加上這行，讓你隨時可以按按鈕手動測試
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run script
        run: python test1.py
